<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>도매회원 안내</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
background:#111;
color:#eee;
font-family:'Noto Sans KR',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
font-size:18px;
}

.container{
width:90%;
max-width:700px;
text-align:center;
}

h2{
font-weight:600;
margin-bottom:30px;
}

input{
padding:12px;
font-size:16px;
border-radius:6px;
border:none;
width:200px;
}

button{
padding:12px 20px;
margin:8px;
border:none;
border-radius:6px;
background:#2a2a2a;
color:#fff;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#444;
}

.tabs{
margin-bottom:30px;
}

.tabcontent{
display:none;
text-align:left;
background:#1a1a1a;
padding:25px;
border-radius:8px;
margin-top:20px;
line-height:1.6;
}

.backbtn{
margin-top:25px;
display:block;
}

</style>

</head>

<body>

<div class="container">

<div id="login">

<h2>비밀번호 입력</h2>

<input type="password" id="password" placeholder="비밀번호">

<br>

<button onclick="checkPassword()">입장</button>

</div>


<div id="main" style="display:none;">

<h2>도매회원 안내</h2>

<div class="tabs">

<button onclick="openTab('tab1')">샘플북 신청 및 프리시즌</button>

<button onclick="openTab('tab2')">도매주문단위</button>

<button onclick="openTab('tab3')">이용 안내</button>

</div>


<div id="tab1" class="tabcontent">

샘플북 신청 및 프리시즌 내용 입력

<button class="backbtn" onclick="backToMenu()">돌아가기</button>

</div>


<div id="tab2" class="tabcontent">

도매 주문 단위 내용 입력

<button class="backbtn" onclick="backToMenu()">돌아가기</button>

</div>


<div id="tab3" class="tabcontent">

이용 안내 내용 입력

<button class="backbtn" onclick="backToMenu()">돌아가기</button>

</div>


</div>

</div>


<script>

const password="1234";

function checkPassword(){

let input=document.getElementById("password").value;

if(input===password){
document.getElementById("login").style.display="none";
document.getElementById("main").style.display="block";
}else{
alert("비밀번호가 틀렸습니다");
}

}

function openTab(tabId){

let tabs=document.getElementsByClassName("tabcontent");

for(let i=0;i<tabs.length;i++){
tabs[i].style.display="none";
}

document.getElementById(tabId).style.display="block";

}

function backToMenu(){

let tabs=document.getElementsByClassName("tabcontent");

for(let i=0;i<tabs.length;i++){
tabs[i].style.display="none";
}

}

</script>

</body>
</html>
